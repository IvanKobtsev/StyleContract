name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: node npm/verify-release.js
      - run: node --check npm/style-contract.js
      - run: node --check npm/create-platform-package.js
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Verify Linux package executable mode
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node npm/create-platform-package.js \
            target/release/style-contract \
            dist/binary-linux-x64-gnu \
            @style-contract/binary-linux-x64-gnu \
            linux x64 gnu
          npm pack ./dist/binary-linux-x64-gnu --pack-destination dist
          mkdir -p dist/unpacked
          tar -xzf dist/style-contract-binary-linux-x64-gnu-*.tgz -C dist/unpacked
          test -x dist/unpacked/package/style-contract
